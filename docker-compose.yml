services:
  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: utsdua_php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - utsnet

  nginx:
    image: nginx:latest
    container_name: utsdua_nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - utsnet

  db:
    image: mariadb:10.11
    container_name: utsdua_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uts
    ports:
      - "13307:3306"
    networks:
      - utsnet

networks:
  utsnet: